name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build universal app bundle
        run: UNIVERSAL=1 ./scripts/build_app.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "build/ESP Flasher.app" ESP-Flasher-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Flasher-macOS
          path: ESP-Flasher-macOS.zip
          if-no-files-found: error

  release:
    # Pushing a tag like v1.0.0 publishes the zip as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ESP-Flasher-macOS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ESP-Flasher-macOS.zip
          generate_release_notes: true
